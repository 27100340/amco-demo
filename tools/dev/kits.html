<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { listKits, buildKit, hasKit } from '../../website/assets/app/engine/kits/index.js';
import '../../website/assets/app/engine/kits/all.js';
import { KIT_IDS, KIT_FAMILIES } from '../../website/assets/app/engine/kits/ids.js';
import { findProperty } from '../../website/assets/app/properties/index.js';
import { validateBuilding } from '../../website/assets/app/model/schema.js';
import { roomPolygons } from '../../website/assets/app/model/surfaces.js';
import { nodeWalls } from '../../website/assets/app/model/geometry.js';

const query = new URLSearchParams(location.search);
const report = document.getElementById('report');
const stage = document.getElementById('stage');

/* Showcase parameters for kits that need them in the grid. */
const DEMO_PARAMS = {
  'door.panel': { width: 0.9, height: 2.1, thickness: 0.115, role: 'interior' },
  'door.main': { width: 1.2, height: 2.4, thickness: 0.23, role: 'exterior' },
  'door.glass': { width: 0.9, height: 2.4, thickness: 0.1, role: 'glass' },
  'door.glass-slider': { width: 2.4, height: 2.4, thickness: 0.23, role: 'exterior' },
  'window.casement': { width: 1.5, height: 1.5, thickness: 0.23, role: 'exterior' },
  'window.fixed': { width: 1.2, height: 1.8, thickness: 0.23, role: 'exterior' },
  'shutter.rolling': { width: 3, height: 2.7, thickness: 0.23, role: 'exterior' },
  'shopfront.glass': { width: 4.8, height: 3.3, thickness: 0.23, role: 'exterior' },
  'curtainwall': { width: 6, height: 3.4, thickness: 0.23, role: 'exterior' },
  'garage.door': { width: 2.7, height: 2.3, thickness: 0.23, role: 'exterior' },
  'gate.sliding': { width: 4.5, height: 2.1, thickness: 0.23, role: 'exterior' },
  'hedge': { length: 3 },
  'kitchen.run': { length: 3.6 },
  'table.meeting': { seats: 8 },
  'curtain.pair': { width: 2.4, height: 2.8 },
  'blind.roller': { width: 1.5, height: 1.6 },
  'art.frame': { w: 1.0, h: 0.75 },
  'books.row': { length: 0.6 },
  'sign.fascia': { text: 'Noor Boutique', width: 4.8, style: 'boutique' },
  'awning': { width: 4.8 },
  'louvre.screen': { width: 2.4, height: 3 },
  'canopy.slab': { width: 3, depth: 1.2 },
  'balcony.rail': { length: 3 },
  'stair.dogleg': { height: 3.2, width: 2.4, length: 4.2 },
  'stair.straight': { height: 3.2, width: 1.0 }
};
const OPENING_PREFIXES = ['door.', 'window.', 'shutter.', 'shopfront.', 'curtainwall', 'garage.', 'gate.'];

/* Fallback material map, used until the engine's material registry is available. */
const LOCAL = {
  paint: { color: '#efece6', roughness: 0.9 },
  plaster: { color: '#e9e5dd', roughness: 0.95 },
  concrete: { color: '#a9a6a0', roughness: 0.9 },
  marble: { color: '#ecebe8', roughness: 0.22 },
  porcelain: { color: '#e4e0d8', roughness: 0.3 },
  'oak-floor': { color: '#c49a6c', roughness: 0.55 },
  walnut: { color: '#5d3d27', roughness: 0.55 },
  'stone-cladding': { color: '#a39684', roughness: 0.9 },
  brick: { color: '#a5543a', roughness: 0.9 },
  'fabric-linen': { color: '#bdb5a8', roughness: 0.95 },
  leather: { color: '#6b4630', roughness: 0.5 },
  lawn: { color: '#5d7f3a', roughness: 1 },
  paving: { color: '#b9b2a6', roughness: 0.9 },
  asphalt: { color: '#3b3c3e', roughness: 0.95 },
  gravel: { color: '#9d968b', roughness: 1 },
  'brushed-steel': { color: '#c3c6c9', roughness: 0.32, metalness: 1 },
  chrome: { color: '#f2f2f2', roughness: 0.06, metalness: 1 },
  'aluminium-dark': { color: '#2c2e31', roughness: 0.45, metalness: 0.7 },
  'ceramic-white': { color: '#f3f1ed', roughness: 0.3 },
  rubber: { color: '#1d1d1f', roughness: 0.9 },
  'carpet-tile': { color: '#5d6166', roughness: 1 }
};
const localCache = new Map();
function localMaterial(id, opts = {}) {
  const key = `${id}|${JSON.stringify(opts)}`;
  if (localCache.has(key)) return localCache.get(key);
  let material;
  if (id === 'glass' || id === 'glass-frosted') {
    material = new THREE.MeshPhysicalMaterial({ color: opts.color || (id === 'glass' ? '#cfe0e4' : '#eef2f2'), roughness: id === 'glass' ? 0.04 : 0.5, metalness: 0, transparent: true, opacity: id === 'glass' ? 0.28 : 0.75, clearcoat: 1, depthWrite: false });
  } else if (id === 'led') {
    material = new THREE.MeshStandardMaterial({ color: '#fff6e8', emissive: opts.color || '#fff0d8', emissiveIntensity: 2.5 });
  } else {
    const base = LOCAL[id] || { color: '#888888', roughness: 0.8 };
    material = new THREE.MeshStandardMaterial({ color: opts.color || base.color, roughness: opts.roughness ?? base.roughness, metalness: opts.metalness ?? base.metalness ?? 0 });
  }
  localCache.set(key, material);
  return material;
}

async function materialSource() {
  if (query.get('mat') !== 'local') {
    try {
      const registry = await import('../../website/assets/app/engine/materials/registry.js');
      if (typeof registry.getMaterial === 'function') return { mat: registry.getMaterial, source: 'engine registry' };
    } catch (err) {
      return { mat: localMaterial, source: 'local fallback' };
    }
  }
  return { mat: localMaterial, source: 'local fallback' };
}

function stats(object) {
  let meshes = 0;
  let triangles = 0;
  object.traverse((o) => {
    if (o.isMesh) {
      meshes += 1;
      const g = o.geometry;
      triangles += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  return { meshes, triangles: Math.round(triangles), size: [size.x, size.y, size.z].map((v) => +v.toFixed(2)), box };
}

function wallAround(params, mat) {
  const pad = 0.6;
  const w = params.width + pad * 2;
  const h = params.height + pad;
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(w / 2, h); shape.lineTo(-w / 2, h); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-params.width / 2, 0); hole.lineTo(-params.width / 2, params.height); hole.lineTo(params.width / 2, params.height); hole.lineTo(params.width / 2, 0); hole.closePath();
  shape.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(shape, { depth: params.thickness, bevelEnabled: false });
  g.translate(0, 0, -params.thickness / 2);
  const mesh = new THREE.Mesh(g, mat('paint', { color: '#e6e1d8' }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function chosenIds() {
  const only = query.get('only');
  const family = query.get('family');
  if (only) return only.split(',').filter(Boolean);
  if (family) return (KIT_FAMILIES[family] || []).slice();
  return listKits();
}

async function grid() {
  const { mat, source } = await materialSource();
  const quality = query.get('q') || 'high';
  const ctx = { THREE, mat, rounded: (w, h, d, r, seg = 4) => new RoundedBoxGeometry(w, h, d, seg, r), quality };
  const ids = chosenIds();
  const cell = Number(query.get('cell')) || 340;
  const cols = Number(query.get('cols')) || Math.max(1, Math.floor(innerWidth / cell));
  const rows = Math.ceil(ids.length / cols);
  const labelH = 40;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(cols * cell, rows * (cell + labelH));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = Number(query.get('exposure')) || 1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.setScissorTest(true);
  stage.appendChild(renderer.domElement);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const angle = (Number(query.get('angle') ?? 32) * Math.PI) / 180;
  const elevation = (Number(query.get('elev') ?? 18) * Math.PI) / 180;
  const items = [];
  const results = [];
  const height = rows * (cell + labelH);
  const renderItem = (item) => {
    const x = item.col * cell;
    const y = height - (item.row * (cell + labelH) + cell);
    renderer.setViewport(x, y, cell, cell);
    renderer.setScissor(x, y, cell, cell);
    renderer.render(item.scene, item.camera);
  };
  for (const [i, id] of ids.entries()) {
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const params = query.get('params') ? JSON.parse(query.get('params')) : (DEMO_PARAMS[id] || {});
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#ece9e4');
    scene.environment = env;
    scene.environmentIntensity = 0.75;
    const entry = { id, error: null };
    let kit = null;
    try {
      if (!hasKit(id)) throw new Error('not registered');
      kit = buildKit(id, params, ctx);
      scene.add(kit);
      if (OPENING_PREFIXES.some((prefix) => id.startsWith(prefix)) && params.width) scene.add(wallAround(params, mat));
      Object.assign(entry, stats(kit));
    } catch (err) {
      console.error(id, err);
      entry.error = String(err && err.message || err);
    }
    const box = entry.box || new THREE.Box3(new THREE.Vector3(-0.5, 0, -0.5), new THREE.Vector3(0.5, 1, 0.5));
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    const floor = new THREE.Mesh(new THREE.CircleGeometry(Math.max(2, sphere.radius * 4), 48), new THREE.MeshStandardMaterial({ color: '#dcd7cf', roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const sun = new THREE.DirectionalLight('#fff6ea', 2.2);
    const r = sphere.radius;
    sun.position.set(sphere.center.x - r * 1.2, sphere.center.y + r * 2.4, sphere.center.z - r * 1.6);
    sun.target.position.copy(sphere.center);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -r * 1.6; sun.shadow.camera.right = r * 1.6;
    sun.shadow.camera.top = r * 1.6; sun.shadow.camera.bottom = -r * 1.6;
    sun.shadow.camera.near = 0.01; sun.shadow.camera.far = r * 8;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.01;
    scene.add(sun, sun.target);
    scene.add(new THREE.HemisphereLight('#ffffff', '#b9b1a5', 0.5));
    const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 200);
    const dist = (r / Math.sin((camera.fov * Math.PI) / 360)) * 1.02;
    camera.position.set(sphere.center.x - Math.sin(angle) * Math.cos(elevation) * dist, sphere.center.y + Math.sin(elevation) * dist, sphere.center.z - Math.cos(angle) * Math.cos(elevation) * dist);
    camera.lookAt(sphere.center);
    const col = i % cols;
    const row = Math.floor(i / cols);
    const item = { scene, camera, kit, col, row, sphere };
    items.push(item);
    renderItem(item);
    const label = document.createElement('div');
    label.className = entry.error ? 'label error' : 'label';
    label.style.left = `${col * cell}px`;
    label.style.top = `${row * (cell + labelH) + cell}px`;
    label.style.width = `${cell}px`;
    label.innerHTML = entry.error ? `<b>${id}</b><br><span>${entry.error}</span>` : `<b>${id}</b><br><span>${entry.meshes} draws · ${(entry.triangles / 1000).toFixed(1)}k tris · ${entry.size.join(' × ')} m</span>`;
    stage.appendChild(label);
    delete entry.box;
    results.push(entry);
  }
  if (query.get('spin') === '1') {
    renderer.setAnimationLoop((t) => {
      for (const item of items) {
        if (item.kit) item.kit.rotation.y = t * 0.0004;
        renderItem(item);
      }
    });
  }
  const registered = listKits();
  const missingFromIds = registered.filter((id) => !KIT_IDS.includes(id));
  const notRegistered = KIT_IDS.filter((id) => !registered.includes(id));
  const errors = results.filter((r) => r.error);
  report.textContent = JSON.stringify({ materials: source, registered: registered.length, listed: KIT_IDS.length, missingFromIds, notRegistered, errors, kits: results }, null, 1);
  document.title = errors.length || missingFromIds.length || notRegistered.length ? `KITS: ${errors.length} errors, ${missingFromIds.length + notRegistered.length} id mismatches` : 'KITS OK';
}

/* ---- property preview: walls cut like a plan, floors, opening infills and fixtures ---- */

const DEFAULT_STYLE = { door: 'door.panel', window: 'window.casement', shopfront: 'shopfront.glass', garage: 'garage.door' };
const FLOOR_BY_USE = { bedroom: 'oak-floor', kitchen: 'porcelain', bath: 'porcelain', office: 'carpet-tile', meeting: 'carpet-tile', pantry: 'porcelain', shop: 'porcelain', cafe: 'porcelain', fitting: 'oak-floor', store: 'concrete', stair: 'marble', hall: 'marble' };
const GROUND_MATERIAL = { lawn: 'lawn', paving: 'paving', road: 'asphalt', gravel: 'gravel' };

function addBox(group, material, w, h, d, matrix) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.applyMatrix4(matrix);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
}

function wallPieces(wall, height, cut) {
  const len = Math.hypot(wall.b[0] - wall.a[0], wall.b[1] - wall.a[1]);
  const top = Math.min(height, cut);
  const spans = (wall.openings || []).map((o) => ({ s: o.at - o.width / 2, e: o.at + o.width / 2, sill: o.sill || 0, head: (o.sill || 0) + o.height })).sort((x, y) => x.s - y.s);
  const pieces = [];
  let t = -wall.thickness / 2;
  for (const o of spans) {
    if (o.s > t) pieces.push([t, o.s, 0, top]);
    if (o.sill > 0) pieces.push([o.s, o.e, 0, Math.min(o.sill, top)]);
    if (o.head < top) pieces.push([o.s, o.e, o.head, top]);
    t = Math.max(t, o.e);
  }
  if (t < len + wall.thickness / 2) pieces.push([t, len + wall.thickness / 2, 0, top]);
  return { len, pieces: pieces.filter((p) => p[1] - p[0] > 1e-3 && p[3] - p[2] > 1e-3) };
}

function wallFrame(wall, elevation) {
  const dx = wall.b[0] - wall.a[0];
  const dy = wall.b[1] - wall.a[1];
  const len = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  return (t, y, z) => new THREE.Matrix4().compose(
    new THREE.Vector3(wall.a[0] + (dx / len) * t, elevation + y, -(wall.a[1] + (dy / len) * t)),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, angle, 0)),
    new THREE.Vector3(1, 1, 1)
  ).multiply(new THREE.Matrix4().makeTranslation(0, 0, z));
}

async function preview(id) {
  const { mat, source } = await materialSource();
  const entry = findProperty(id);
  if (!entry) throw new Error(`no property ${id}`);
  const building = await entry.load();
  const check = validateBuilding(building);
  const quality = query.get('q') || 'high';
  const ctx = { THREE, mat, rounded: (w, h, d, r, seg = 4) => new RoundedBoxGeometry(w, h, d, seg, r), quality };
  const width = Number(query.get('w')) || innerWidth;
  const height = Number(query.get('h')) || innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#dfe6ea');
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.7;
  const shown = query.get('levels') ? query.get('levels').split(',') : building.levels.map((l) => l.id);
  const cut = Number(query.get('cut')) || Infinity;
  const polygons = roomPolygons(building);
  const wallMat = mat('paint', { color: '#eeebe5' });
  const kitErrors = [];
  let fixtures = 0;
  const place = (object, x, elevation, y, degrees) => {
    object.position.set(x, elevation, -y);
    object.rotation.y = (-degrees * Math.PI) / 180;
    scene.add(object);
  };
  for (const level of building.levels.filter((l) => shown.includes(l.id))) {
    for (const wall of nodeWalls(building.walls.filter((w) => w.level === level.id))) {
      const frame = wallFrame(wall, level.elevation);
      const h = wall.height ?? level.ceiling;
      const material = wall.role === 'glass' ? mat('glass') : wallMat;
      for (const [t0, t1, y0, y1] of wallPieces(wall, h, cut).pieces) addBox(scene, material, t1 - t0, y1 - y0, wall.thickness, frame((t0 + t1) / 2, (y0 + y1) / 2, 0));
      for (const o of wall.openings || []) {
        const style = o.style || DEFAULT_STYLE[o.type];
        if (!style || (o.sill || 0) >= cut) continue;
        try {
          const kit = buildKit(style, { width: o.width, height: o.height, thickness: wall.thickness, role: wall.role }, ctx);
          kit.applyMatrix4(frame(o.at, o.sill || 0, 0));
          scene.add(kit);
        } catch (err) {
          kitErrors.push(`${style}: ${err.message}`);
        }
      }
    }
    for (const room of building.rooms.filter((r) => r.level === level.id)) {
      const poly = polygons.get(room.id);
      if (!poly) continue;
      const g = new THREE.ShapeGeometry(new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, y))));
      g.rotateX(-Math.PI / 2);
      const floor = new THREE.Mesh(g, mat(room.floor || FLOOR_BY_USE[room.use] || 'marble'));
      floor.position.y = level.elevation + 0.002;
      floor.receiveShadow = true;
      scene.add(floor);
    }
    for (const fixture of (building.fixtures || []).filter((fx) => fx.level === level.id)) {
      try {
        place(buildKit(fixture.kit, fixture.params, ctx), fixture.at[0], level.elevation, fixture.at[1], fixture.rotation || 0);
        fixtures += 1;
      } catch (err) {
        kitErrors.push(`${fixture.kit}: ${err.message}`);
      }
    }
  }
  const site = building.site;
  const xs = [];
  const ys = [];
  for (const w of building.walls) { xs.push(w.a[0], w.b[0]); ys.push(w.a[1], w.b[1]); }
  if (site) {
    for (const [x, y] of site.boundary) { xs.push(x); ys.push(y); }
    for (const patch of site.ground || []) {
      const g = new THREE.ShapeGeometry(new THREE.Shape(patch.polygon.map(([x, y]) => new THREE.Vector2(x, y))));
      g.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(g, mat(GROUND_MATERIAL[patch.material] || 'paving'));
      mesh.position.y = 0.001;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }
    if (site.boundaryWall) {
      const pts = site.boundary;
      pts.forEach((p, i) => {
        const q = pts[(i + 1) % pts.length];
        const wall = { a: p, b: q, thickness: site.boundaryWall.thickness, openings: [] };
        const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
        for (const gate of site.boundaryWall.gates || []) {
          const t = ((gate.at[0] - p[0]) * (q[0] - p[0]) + (gate.at[1] - p[1]) * (q[1] - p[1])) / len;
          const off = Math.abs((gate.at[0] - p[0]) * (q[1] - p[1]) - (gate.at[1] - p[1]) * (q[0] - p[0])) / len;
          if (off < 0.2 && t > 0 && t < len) {
            wall.openings.push({ at: t, width: gate.width, height: site.boundaryWall.height, sill: 0 });
            const kit = buildKit(gate.style || 'gate.sliding', { width: gate.width, height: site.boundaryWall.height }, ctx);
            kit.applyMatrix4(wallFrame(wall, 0)(t, 0, 0));
            scene.add(kit);
          }
        }
        const frame = wallFrame(wall, 0);
        for (const [t0, t1, y0, y1] of wallPieces(wall, site.boundaryWall.height, Infinity).pieces) addBox(scene, mat('paint', { color: '#e9e4da' }), t1 - t0, y1 - y0, wall.thickness, frame((t0 + t1) / 2, (y0 + y1) / 2, 0));
      });
    }
  }
  const minX = Math.min(...xs); const maxX = Math.max(...xs); const minY = Math.min(...ys); const maxY = Math.max(...ys);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat(site && site.street ? 'asphalt' : 'paving'));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set((minX + maxX) / 2, -0.01, -(minY + maxY) / 2);
  ground.receiveShadow = true;
  scene.add(ground);
  const centre = new THREE.Vector3((minX + maxX) / 2, 0, -(minY + maxY) / 2);
  const span = Math.max(maxX - minX, maxY - minY);
  const sun = new THREE.DirectionalLight('#fff4e6', 2.6);
  sun.position.set(centre.x - span * 0.6, span * 1.4, centre.z + span * 0.9);
  sun.target.position.copy(centre);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 0.1, far: span * 4 });
  sun.shadow.bias = -0.0003;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target, new THREE.HemisphereLight('#f3f7ff', '#9a9282', 0.6));
  const view = query.get('view') || 'top';
  let camera;
  if (view === 'top') {
    const aspect = width / height;
    const half = span * 0.55;
    camera = new THREE.OrthographicCamera(-half * aspect, half * aspect, half, -half, 0.1, 200);
    camera.position.set(centre.x, 60, centre.z);
    camera.up.set(0, 0, -1);
    camera.lookAt(centre);
  } else if (view.startsWith('room:')) {
    const room = building.rooms.find((r) => r.id === view.slice(5));
    const poly = polygons.get(room.id);
    const level = building.levels.find((l) => l.id === room.level);
    const rx = poly.map((p) => p[0]);
    const ry = poly.map((p) => p[1]);
    const c = query.get('look') ? query.get('look').split(',').map(Number) : [(Math.min(...rx) + Math.max(...rx)) / 2, (Math.min(...ry) + Math.max(...ry)) / 2];
    const corner = query.get('from') ? query.get('from').split(',').map(Number) : [Math.min(...rx) + 0.4, Math.min(...ry) + 0.4];
    camera = new THREE.PerspectiveCamera(Number(query.get('fov')) || 70, width / height, 0.05, 200);
    camera.position.set(corner[0], level.elevation + (Number(query.get('eye')) || 1.55), -corner[1]);
    camera.lookAt(c[0], level.elevation + 1.0, -c[1]);
  } else {
    const az = (Number(query.get('az') ?? 35) * Math.PI) / 180;
    const el = (Number(query.get('el') ?? 35) * Math.PI) / 180;
    const dist = span * (Number(query.get('zoom')) || 1.25);
    camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 400);
    camera.position.set(centre.x + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, centre.z + Math.cos(az) * Math.cos(el) * dist);
    camera.lookAt(centre.x, 2, centre.z);
  }
  renderer.render(scene, camera);
  const info = { property: id, materials: source, valid: check.ok, errors: check.errors, warnings: check.warnings, fixtures, kitErrors, drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  report.textContent = JSON.stringify(info, null, 1);
  document.title = check.ok && !kitErrors.length ? `PREVIEW OK ${renderer.info.render.calls} draws` : 'PREVIEW ERRORS';
}

(query.get('property') ? preview(query.get('property')) : grid()).catch((err) => {
  console.error(err);
  report.textContent = `FAILED: ${err && err.stack || err}`;
  document.title = 'KITS FAILED';
});
</script>
</body>
</html>
